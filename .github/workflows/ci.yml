name: CI & Desktop Build Matrix

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Legacy Embed Assets
        run: node scripts/prepare-legacy-assets.mjs

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Run Go Unit Tests
        run: go test -v -race ./...

  build-windows:
    name: Desktop Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Legacy Embed Assets
        run: node scripts/prepare-legacy-assets.mjs

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Test Windows Synthetic GUI Lifecycle
        run: go test -v ./gui -run '^TestServerLifecycle$' -count=1 -timeout=90s

      - name: Test Windows v11 Unsupported Upgrade Safety Refusal
        run: go test -v ./core/history -run '^TestV11UpgradeBackupWindowsUnsupportedPrivateRootBlocksDDL$' -count=1 -timeout=90s

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Windows Desktop Executable
        run: |
          go build -v -trimpath -ldflags "-s -w -H windowsgui" -o build/bin/clash-speedtest.exe .

      - name: Verify Windows Binary Exists
        run: |
          if (!(Test-Path "build/bin/clash-speedtest.exe")) {
            throw "Windows binary build failed: clash-speedtest.exe not found"
          }

  build-macos:
    name: Desktop Build (macOS Native App)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Legacy Embed Assets
        run: node scripts/prepare-legacy-assets.mjs

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Test macOS Synthetic Persistence and GUI Contracts
        run: go test -race ./core/history ./application ./core/appdata ./gui -count=1 -timeout=180s

      - name: Test Darwin Physical DNS Offline Contracts
        run: |
          go test -race ./core/speedtester -run '^(TestStrictPhysicalDNS|TestStrictDNS|TestPhysicalDNS)' -count=1 -timeout=90s

      - name: Build macOS Native App
        run: |
          wails build -platform darwin/arm64 -s -v 2

      - name: Verify macOS App Bundle Exists
        run: |
          if [ -d "build/bin/Clash SpeedTest Pro.app" ]; then
            echo "Found build/bin/Clash SpeedTest Pro.app"
          elif [ -d "build/bin/clash-speedtest.app" ]; then
            echo "Found build/bin/clash-speedtest.app"
          else
            echo "macOS app bundle was not produced" >&2
            exit 1
          fi
