name: Candidate source and capability audit
on:
  push:
    branches: ['codex/cst-w12i-integration-20261011-6aa2079']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked source for exact-revision reproduction
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/candidate-source.tar.gz" HEAD
      - name: Offline audit regression fixtures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify GitHub revision, main ancestry and accepted capabilities
        run: python3 scripts/candidate_audit.py --online --branch '${{ github.ref_name }}' --json-output candidate-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-audit-${{ github.sha }}
          retention-days: 7
          path: |
            candidate-audit.json
            ${{ runner.temp }}/candidate-source.tar.gz

  offline-regression-linux:
    name: Offline Go race and frontend regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/prepare-legacy-assets.mjs
      - name: Frontend dependencies
        id: frontend_deps
        working-directory: frontend
        run: npm ci
      - name: Frontend regression
        id: frontend_tests
        working-directory: frontend
        run: npm test -- --maxWorkers=2 --minWorkers=2
      - name: Frontend build
        if: ${{ !cancelled() && steps.frontend_deps.outcome == 'success' }}
        working-directory: frontend
        run: npm run build
      - name: Package installed dependencies only after frontend failure
        if: ${{ !cancelled() && steps.frontend_deps.outcome == 'success' && steps.frontend_tests.outcome == 'failure' }}
        run: |
          # Deliberately exclude .git, npm credentials, home, and all runtime data.
          tar -czf frontend-dependencies.tar.gz -C frontend node_modules
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.frontend_tests.outcome == 'failure' && steps.frontend_deps.outcome == 'success' }}
        with:
          name: frontend-repro-${{ github.sha }}
          path: frontend-dependencies.tar.gz
          retention-days: 3
          compression-level: 0
      - name: Synthetic Go regression
        if: ${{ !cancelled() }}
        run: go test -race -p 2 ./... -count=1 -timeout=180s

  macos-contracts-build:
    name: Mac offline contracts and native build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/prepare-legacy-assets.mjs
      - name: Frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Mac synthetic persistence, TLS, proxy and physical contracts
        run: go test -race -p 2 ./core/history ./core/publicservice ./core/profiles ./core/speedtester ./core/monitor ./application ./adapter/desktop ./gui -count=1 -timeout=180s
      - name: Build exact revision native core
        run: |
          mkdir -p build/bin
          go build -tags production -buildvcs=true -trimpath -ldflags '-X main.commit=${{ github.sha }} -X main.version=mac-ci-${{ github.run_number }}' -o build/bin/cst-core .
      - name: Package isolated Mac candidate with exact build manifest
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/package-mac-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: CST-Mac-${{ github.sha }}
          path: build/bin/CST-Mac-candidate.zip
          retention-days: 7
          compression-level: 0
