<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Timeline render evidence (synthetic data)</title>
<style>
  :root {
    /* Mirrors src/style.css light theme so the canvas resolves the real palette. */
    --canvas: #f8fafc;
    --card-bg: #ffffff;
    --card-subtle: #f1f5f9;
    --border: #e2e8f0;
    --border-subtle: #cbd5e1;
    --text-main: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --primary: #2563eb;
    --success: #059669;
    --warning: #d97706;
    --danger: #dc2626;
  }
  body {
    background: var(--canvas);
    color: var(--text-main);
    margin: 0;
    padding: 18px 20px 26px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .watermark {
    display: inline-block;
    font-size: 11px;
    color: #92400e;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 4px;
    padding: 3px 8px;
    margin-bottom: 14px;
  }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-secondary); margin-bottom: 16px; flex-wrap: wrap; }
  .legend b { color: var(--text-main); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .scenario { margin-bottom: 20px; }
  .caption { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .caption .title { font-weight: 600; color: var(--text-main); font-size: 12px; }
  .caption .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-muted); }
  .card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--card-bg); display: flex; }
  .lane-labels { position: relative; width: 158px; flex: none; border-right: 1px solid var(--border); }
  .lane-label { position: absolute; left: 0; right: 0; padding: 3px 8px 0; overflow: hidden; }
  .lane-label b { display: block; font-size: 11px; font-weight: 600; color: var(--text-main); line-height: 1.35; }
  .lane-label span { display: block; font-size: 9.5px; color: var(--text-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  canvas { display: block; }
</style>
</head>
<body>
  <h1>监控稳定性时间轴 — 渲染层证据</h1>
  <div class="watermark">
    合成数据 · 仅用于验证渲染层与图元语义 · 非生产监控历史 · 不参与打包
  </div>

  <div class="legend">
    <span><b>│•</b> 成功（延迟茎高）</span>
    <span><b>✕</b> 传输失败</span>
    <span><b>╱</b> 服务层失败</span>
    <span><b>○</b> 未归类失败</span>
    <span><b>┆</b> 配置修订边界</span>
  </div>

  <div id="scenarios"></div>

  <script type="module" src="./harness.ts"></script>
</body>
</html>
