function nodeIdentity(n){const a=airport(n.airport);return `<div class="node-id"><span class="region">${n.region}</span><div><button class="node-name" data-detail="${n.id}" aria-expanded="${state.detail===n.id}">${n.name}</button><div class="node-meta">${a.name} · ${a.accounts[n.account]} · ${n.protocol}</div><button class="exit-line" data-ip="${n.id}" aria-label="查看 ${n.name} 的示例出口与信誉状态">${n.exitIp?`出口 ${n.exitRegion} · <span class="mono">${n.exitIp}</span>`:"出口未查"} <span class="ip-label">信誉未查</span></button></div></div>`}
function latMetric(n){return `<div class="metric-line"><strong class="num">${n.lat[0]??'—'}</strong><small>${n.lat[0]===null?'未获得样本':'ms · 单次观察'}</small></div><div class="six-lane">${n.lat.map((v,i)=>`<button class="${v===null?'missing':''}" data-tip="${esc(`${DEMO.targets[i][1]}：${v===null?'未获得有效响应，不记为 0':v+' ms'} · 本轮 1 次观察`)}" data-detail="${n.id}" aria-label="${DEMO.targets[i][1]} ${v??'未确认'}">${DEMO.targets[i][0]}</button>`).join('')}</div>`}
function downMetric(n){return `<div class="metric-line"><strong class="num">${n.down?.toFixed(1)??'—'}</strong><small>${n.down===null?(n.oldDown?'源限流':'未测'):'MiB/s'}</small></div>${n.down===null?`<div class="node-meta">${n.oldDown?'历史 '+n.oldDown+' 不代替本次':'无本轮有效速度'}</div>`:`<div class="speed-bar" title="相对样例同条件速度，非带宽上限"><i style="width:${n.down/45*100}%"></i></div><div class="node-meta">10 MiB · ${n.time}</div>`}`}
function historySnapshot(n,i){const factor=[1.18,1.08,1.15,1.04,1][i];return {...n,lat:n.lat.map(v=>v===null?null:Math.round(v*factor)),down:n.down===null?null:Math.round(n.down/factor*10)/10,time:['12:40','12:50','13:00','13:10',n.time][i]}}
function rowHistory(n){return `<div class="history-strip">${[0,1,2,3,4].map(i=>{const x=historySnapshot(n,i);return `<button style="height:${x.lat[0]===null?9:Math.min(24,8+x.lat[0]/20)}px" data-tip="${n.name} · 示例第 ${i+1} 轮 / ${x.time} / CF ${x.lat[0]??'未知'} ms · 点击固定" data-detail-round="${n.id}:${i}" aria-label="固定 ${n.name} 示例第${i+1}轮记录"></button>`}).join('')}</div><div class="node-meta">${n.time} · 点击固定</div>`}

function serviceButton(n,i,mini=false){let [t,tone]=label(n.services[i]),s=DEMO.services[i];return mini?`<button class="service-mini ${tone}" data-service="${n.id}:${i}" data-tip="${esc(s.name+'：'+t+'；'+s.kind)}"><i></i>${s.short} ${t}</button>`:`<button class="service-cell ${tone}" data-service="${n.id}:${i}">${t}<small>${n.services[i]==='untested'?'无保存结果':s.kind}</small></button>`}
function nodeRow(n,mode,len){let mid=mode==='combined'?`<td>${latMetric(n)}</td><td>${downMetric(n)}</td><td><div class="service-pairs">${[0,1,2,3].map(i=>serviceButton(n,i,true)).join('')}</div></td><td>${rowHistory(n)}</td><td><button class="iconbtn" data-detail="${n.id}" aria-label="查看 ${n.name} 详情">${icon('chevron')}</button></td>`:mode==='service'?DEMO.services.map((s,i)=>`<td>${serviceButton(n,i)}</td>`).join(''):mode==='latency'?`<td><div class="measure-grid">${n.lat.map((v,i)=>`<button class="cell-probe ${v===null?'unknown':''}" data-service="${n.id}:latency:${i}">${v??'—'}<small>${DEMO.targets[i][1]}</small></button>`).join('')}</div></td><td>${tag(n.state,n.tone)}<div class="node-meta">${n.time} · 本站 1 样本</div></td><td><button class="iconbtn" data-detail="${n.id}" aria-label="查看 ${n.name} 详情">${icon('chevron')}</button></td>`:`<td>${downMetric(n)}</td><td><span class="small">${n.down?'10 MiB / '+(10/n.down).toFixed(2)+' s · 短测平均':'本次未形成有效吞吐量'}</span><div class="node-meta">固定示例目标 · 同一方法 · 不是峰值带宽</div></td><td>${tag(n.state,n.tone)}<div class="node-meta">${n.time}</div></td><td><button class="iconbtn" data-detail="${n.id}" aria-label="查看 ${n.name} 详情">${icon('chevron')}</button></td>`;
return `<tr class="${state.selected.has(n.id)?'selected':''}" data-node="${n.id}"><td><input type="checkbox" aria-label="选择 ${airport(n.airport).name} ${n.name}" data-select="${n.id}" ${state.selected.has(n.id)?'checked':''}></td><td>${nodeIdentity(n)}</td>${mid}</tr>${state.detail===n.id?`<tr class="node-detail"><td colspan="${len}">${detail(n)}</td></tr>`:''}`}
function detail(n){const original=n;if(state.pinnedRound!==null)n=historySnapshot(n,state.pinnedRound);return `<div class="detail-sheet"><div class="detail-identity"><div class="eyebrow">PINNED OBSERVATION / ${state.pinnedRound===null?'最新示例记录':'示例第 '+(state.pinnedRound+1)+' 轮 · '+n.time}</div><h2 style="margin:10px 0">${n.name}</h2><p class="small muted">${airport(n.airport).name} · ${airport(n.airport).accounts[n.account]}</p><div class="kv"><span>配置版本</span><b class="mono">${n.rev} · 示例</b></div><div class="kv"><span>地区来源</span><b>订阅声明 · 非实测</b></div><div class="kv"><span>数据来源</span><b>合成设计样例</b></div><button class="textbtn" data-detail="${n.id}">关闭固定详情 ×</button></div><div class="detail-main"><div class="between"><h3>同一轮，看清全部子结果</h3>${tag(n.state,n.tone)}</div><div class="probe-measures">${n.lat.map((v,i)=>`<div>${DEMO.targets[i][0]}<b>${v??'—'}</b><small>${v===null?'未知':'ms / 1样本'}</small></div>`).join('')}</div><div class="stage-track"><span class="stage">接纳<small>原 request_id</small></span><span class="stage">检测<small>各目标独立记录</small></span><span class="stage">保存<small>${n.state.includes('保存失败')?'保存失败':'已保存 / 示例'}</small></span><span class="stage dashed">实际物理路由<small>未独立确认</small></span></div><p class="small muted">这是应用阶段示意，不是 traceroute，也不是实际数据包路径。没有计时证据的阶段不画耗时。</p></div><div class="detail-side"><h3>该怎样判断</h3><p class="small muted" style="margin-top:10px">单次延迟用于本轮观察。P95 样本不足，不显示“最慢延迟”。服务单元格可展开其具体判据。</p><div class="kv"><span>本轮下载</span><b>${n.down??'—'} ${n.down?'MiB/s':''}</b></div><button class="textbtn" data-service="${n.id}:0">查看 Netflix 判据 ${icon('arrow')}</button></div></div>`}
function dock(){const n=selected();const hidden=n.filter(x=>!visible().some(v=>v.id===x.id)).length;return `<section class="selection-dock" aria-label="节点选择操作"><div class="dock-left"><span class="selected-count">${n.length}</span><div><strong class="small">已选 ${n.length} 个节点</strong><div class="small muted">${new Set(n.map(x=>x.airport)).size} 个机场 · ${hidden?hidden+' 个在当前筛选外':'完整账户与配置版本保持绑定'}</div></div><button class="textbtn" id="clear-selection">清空</button></div><div class="flex"><button class="btn" data-modal="compare" ${n.length<2?'disabled':''}>${icon('compare')} 比较所选</button><button class="btn" data-modal="export" ${n.length===0?'disabled':''}>${icon('download')} 导出所选</button><button class="btn primary" data-modal="plan" ${n.length===0?'disabled':''}>查看检测计划 ${icon('arrow')}</button></div></section>`}
function airports(){const a=airport(state.airport);return title('02','SOURCE LEDGER','机场与独立账户','来源是台账，不是“几张状态卡”。',tag('合成账户 · 不联网','purple'))+`<div class="split"><aside class="directory"><h3>机场目录 <span class="muted mono">03</span></h3>${DEMO.airports.map(x=>`<button class="dir-item ${x.id===a.id?'active':''}" data-airport="${x.id}"><span>${x.name} <small class="mono">${x.code}</small></span><small>${x.accounts.length} 账户</small></button>`).join('')}<p class="small muted" style="padding:20px 10px">机场选择与订阅账户分开。<br>切换查看不会启动刷新。</p></aside><div class="pane"><div class="between"><div><div class="eyebrow">${a.code} / SOURCE ACCOUNT</div><h1 style="margin-top:5px">${a.name}</h1></div><button class="btn" data-browse-airport="${a.id}">查看节点 ${icon('arrow')}</button></div><div class="flex wrap" style="margin:18px 0">${a.accounts.map((v,i)=>`<button class="source-chip ${i===0?'active':''}" data-account-info="${a.id}:${i}">${v}</button>`).join('')}</div><div class="account-ledger"><div><span class="eyebrow">流量台账 / 设计示例</span><div class="metric-line" style="margin-top:12px"><span class="big-number">${a.total-a.used}</span><span class="muted">GiB 剩余</span></div><div class="ruler"><span class="filled" style="width:${100*(a.total-a.used)/a.total}%"></span></div><div class="between small muted"><span>已用 ${a.used} GiB</span><span>总额 ${a.total} GiB</span></div></div><div><div class="kv"><span>到期日期</span><b>${a.expire}</b></div><div class="kv"><span>更新时间</span><b>${a.updated}</b></div><div class="kv"><span>有效缓存</span><b>有 · 4 个样例节点</b></div><div class="kv"><span>凭据</span><b>原型不包含订阅地址</b></div></div></div><div class="info-banner">${a.notice}</div><div class="between"><h3>这个机场的节点</h3><span class="small muted">地区不由名称猜测为实测出口</span></div><div class="plain-list">${DEMO.nodes.filter(n=>n.airport===a.id).map(n=>`<div class="plain-row">${nodeIdentity(n)}<span class="mono muted">rev ${n.rev}</span>${tag(n.state,n.tone)}</div>`).join('')}</div></div></div>`}
function historyPage(){const r=DEMO.rounds[state.round];const rounds=DEMO.rounds.filter(x=>state.historyFilter==='all'||x.kind===state.historyFilter);return title('03','MEASUREMENT LOG','把每一轮，留在同一页。','新结果、旧版本与未执行项都有各自的位置。',`<select id="history-filter" aria-label="记录来源">${[['all','全部来源'],['manual','手动检测'],['diagnostic','定向诊断']].map(([v,t])=>`<option value="${v}" ${v===state.historyFilter?'selected':''}>${t}</option>`).join('')}</select>`)+`<div class="history-layout"><div class="round-list">${rounds.map(x=>`<button class="round-item ${x.id===r.id?'active':''}" data-round="${DEMO.rounds.indexOf(x)}"><div class="between"><span class="eyebrow">ROUND ${x.id}</span><span class="mono small muted">${x.time}</span></div><strong>${x.title}</strong><p class="small muted">${x.scope}</p><div style="margin-top:10px">${tag(x.label,x.tone)}</div></button>`).join('')}</div><article class="receipt"><div class="receipt-top"><div><div class="eyebrow">MEASUREMENT RECORD / 示例轮次</div><h2 style="margin-top:10px">${r.title}</h2><p class="small muted" style="margin-top:6px">${r.scope} · 配置版本已冻结</p></div><div class="receipt-number">#${r.id}</div></div><div class="receipt-grid"><div><div class="kv"><span>计划来源</span><b>${r.kind==='manual'?'手动检测':'定向诊断'}</b></div><div class="kv"><span>计划规则</span><b>六站 × 每站 1 次</b></div><div class="kv"><span>保存状态</span><b>已保存（设计样例）</b></div></div><div><div class="kv"><span>终态含义</span><b>处理结束 ≠ 全部成功</b></div><div class="kv"><span>短下载</span><b>10 MiB / 每节点示例</b></div><div class="kv"><span>比较条件</span><b>同站 / 同方法 / 同窗口</b></div></div></div><table class="receipt-table"><thead><tr><th>节点</th><th>六站</th><th>短下载</th><th>服务</th><th>保存</th></tr></thead><tbody>${DEMO.nodes.slice(state.round,state.round+2).map(n=>`<tr><td>${n.name}<div class="node-meta">${airport(n.airport).name} · rev ${n.rev}</div></td><td>${n.lat.filter(x=>x!==null).length}/6 有响应</td><td>${n.down??'—'} MiB/s</td><td>${serviceButton(n,0,true)}</td><td>已保存</td></tr>`).join('')}</tbody></table><h3>本轮子结果</h3><div class="reason-line">${tag('网页可达','blue')} <span class="small">Grok · 入口响应存在，不代表登录或聊天已验证。</span></div><div class="reason-line">${tag('地区受限','bad')} <span class="small">Netflix · 目标片目有地区限制，不归因为节点无法连接。</span></div><div class="reason-line">${tag('未确认','warn')} <span class="small">缺少完整判据时保留未知，不用 HTTP 200 补成通过。</span></div><div class="receipt-end" style="margin-top:22px">所有数字都是设计样例。正式实现复用 MeasurementRound / RoundResults / 已保存记录；不按近似时间拼接不同轮次。</div></article></div>`}
function monitorPage(){return title('04','CONTINUOUS OBSERVATION','持续监测，有明确的开与停。','已经保存的时间条，不冒充现在仍在运行。',tag('本原型没有任何后台任务','purple'))+`<div class="monitor-head"><div><div class="eyebrow">MONITOR / 状态样例</div><h2 style="margin:10px 0">常用线路 · 延迟观察</h2><p class="small muted">2 个节点 · 独立账户 · Cloudflare 目标</p></div><div class="right"><div>${tag('未运行','empty')}</div><p class="small muted" style="margin:10px 0">读取状态与读取时间一起展示</p><button class="btn" data-modal="monitor">查看监测配置样例</button></div></div><div class="monitor-history"><div class="between"><h3>已保存的采样时段</h3><span class="small muted">空格＝没有采样，绝不补成在线</span></div><div class="time-ruler"><span>12:00</span><span>12:10</span><span>12:20</span><span>12:30</span><span>12:40</span><span>12:50</span></div>${DEMO.nodes.slice(0,2).map((n,j)=>`<div class="timeline-row"><div class="timeline-name"><strong>${n.name}</strong><div class="node-meta">${airport(n.airport).name} · ${n.protocol}</div></div><div class="samples">${Array.from({length:24},(_,i)=>`<button class="${i>14?'gap':i===7+j?'warn':''}" data-tip="${i>14?'该时段没有采样，不代表成功或失败':'示例保存记录：'+(i===7+j?'未确认':(58+i*2+j)+' ms') }" data-modal="monitor" aria-label="查看示例时段 ${i+1}"></button>`).join('')}</div></div>`).join('')}<div class="info-banner">这里的历史数据不会触发启动恢复。进入页面、切换主题、展开曲线都不发起探测。</div><div class="between small muted"><span>监测目的与节点选择保持独立</span><span>实时任务动作沿用后端合同，不由界面编造</span></div></div>`}
function settingsPage(){return title('05','PREFERENCES','安静的外观，明确的默认值。','界面设置立即生效；测量设置只作用下一次计划。')+`<div class="settings-layout"><section class="settings-panel"><div class="between"><h2>日间 / 夜间</h2>${themeButtons()}</div><p class="small muted" style="margin-top:8px">同一套六站刻度、线路签与状态颜色。不是反色滤镜。</p><div class="theme-samples"><button class="theme-card" data-theme="day"><div class="mini-window"></div><strong>日间 · 冷瓷与靛蓝</strong><div class="small">长时间比较，克制留白</div></button><button class="theme-card night" data-theme="night"><div class="mini-window"></div><strong>夜间 · 深海与微光</strong><div class="small">保留层级，不用霓虹装饰</div></button></div><div class="setting-row"><div><strong class="small">节点行密度</strong><p>不隐藏地区、身份和当前状态</p></div><select id="density" aria-label="节点行密度"><option value="standard" ${state.density==='standard'?'selected':''}>标准 78 px</option><option value="compact" ${state.density==='compact'?'selected':''}>紧凑 64 px</option></select></div><div class="setting-row"><div><strong class="small">键盘与固定详情</strong><p>Tab 到单元格，Enter 展开，Esc 关闭浮层</p></div>${tag('可操作预览','blue')}</div></section><section class="settings-panel"><h2>测量默认值 · 口径示例</h2><p class="small muted" style="margin-top:8px">正式版本使用现有设置，不增设另一套参数仓库。</p><div class="setting-row"><div><strong class="small">服务观察次数</strong><p>采用已有 1 / 2 / 4 次能力，不额外新增配额</p></div><span class="mono">1 次</span></div><div class="setting-row"><div><strong class="small">下载方式</strong><p>节点间串行；计划显示字节与时间预算</p></div><span class="mono">串行</span></div><div class="setting-row"><div><strong class="small">条件变化</strong><p>新设置不改变已冻结的计划或旧记录</p></div>${tag('下次生效','purple')}</div><details class="disclosure"><summary>高级：规则版本与诊断信息</summary><p>查看 method、rule_version、地址族、出口证据。它们是解释结果的依据，不在首页反复堆满长编码。</p></details><p class="safety">原型仅保存主题偏好，不写入实际 App 配置，不包含模型凭据或真实数据。</p></section></div>`}
function dataPage(){return title('06','DATA CUSTODY','数据留得住，才谈得上回看。','显示当前数据位置和恢复范围，不把复制活动数据库叫备份。')+`<div class="data-shelf"><section class="data-box"><div class="between"><h2>当前数据根</h2>${tag('设计占位 · 非实机','purple')}</div><div class="pathbox">[当前 App 显式数据目录]<br>预览不读取用户路径</div><div class="kv"><span>测量记录</span><b>按轮次 / 节点 / 配置版本</b></div><div class="kv"><span>历史完整度</span><b>来自读取结果，不猜测</b></div><div class="kv"><span>数据库版本</span><b>由真实后端返回</b></div><div class="diagram"><div class="part">原始记录<br><small class="muted">保留证据</small></div><span>→</span><div class="part">一致快照<br><small class="muted">原有备份功能</small></div><span>→</span><div class="part">恢复检查<br><small class="muted">原范围确认</small></div></div><button class="btn" data-modal="restore">查看恢复范围示例 ${icon('arrow')}</button></section><section class="data-box"><h2>资料归属，不混成一个文件夹</h2><div class="plain-row"><div><strong>Obsidian</strong><p class="small muted">当前 UI 设计、功能决定与交接</p></div><span class="mono muted">TEXT</span></div><div class="plain-row"><div><strong>Google Drive</strong><p class="small muted">预览、截图、构建及附件</p></div><span class="mono muted">FILES</span></div><div class="plain-row"><div><strong>GitHub</strong><p class="small muted">源码、具体提交与必要测试</p></div><span class="mono muted">CODE</span></div><div class="info-banner">诊断报告不等于可用代理配置。分享前区分是否包含订阅密钥、服务器与个人历史。</div><details class="disclosure"><summary>旧库与未知状态怎样呈现？</summary><p>安全拒绝显示“未升级”，不是“升级完成”。读取失败保留错误与旧值的时效，不把页面清空成“没有历史”。</p></details></section></div>`}
function showModal(kind,payload){state.focusReturn=document.activeElement;state.modal=kind;state.step=0;drawModal(kind,payload)}
function closeModal(){hideTip();$('.modal-backdrop')?.remove();state.modal=null;const r=state.focusReturn;if(r?.isConnected)r.focus()}
function drawModal(kind,payload){$('.modal-backdrop')?.remove();let titleText='',body='',footer='',wide=false;const ns=selected();if(kind==='plan'){titleText='本次检测计划';body=`<div class="sample-note">这是参数与范围的设计预览，不会启动任何网络测试。</div><div class="flex wrap">${ns.map(n=>tag(airport(n.airport).name+' / '+n.name+' · '+n.rev,'purple')).join('')}</div><div class="form-grid" style="margin-top:20px"><div class="field"><label for="plan-target">延迟目标</label><select id="plan-target"><option value="6">全部六站</option><option value="1">仅 Cloudflare</option></select></div><div class="field"><label for="plan-samples">每站样本</label><select id="plan-samples"><option value="1">1 次 · 快速观察</option><option value="3">3 次</option><option value="6">6 次</option><option value="10">10 次</option><option value="20">20 次</option></select></div><div class="field"><label for="plan-download">每节点下载读取上限（MiB）</label><select id="plan-download"><option>5</option><option selected>10</option><option>20</option><option>50</option><option>100</option></select></div><div class="field"><label for="plan-time">单节点下载时间上限（秒）</label><select id="plan-time"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></div></div><div class="summary-budget" id="budget-summary"></div><p class="small muted">只估算计划的响应体读取预算，不等于实际机场账单。六站内部请求与重定向次数不等于节点并发数。</p><details class="disclosure"><summary>服务判据与费用</summary><p>服务观察次数沿用当前 1 / 2 / 4 次规则，显示目标判据和请求说明。付费模型不默认勾选；改变展示列不会改变计划。</p></details>`;footer=`<span class="small muted">原型不提供真正“开始检测”</span><button class="btn primary" id="save-demo-plan">确认预览参数</button>`}
else if(kind==='compare'){titleText='同条件比较 · 所选节点';wide=true;body=`<p class="sample-note">以下是同一示例时间窗、同一 Cloudflare HTTP 方法的观察值。并非真正节点优劣排名。</p><div class="compare-grid" style="grid-template-columns:repeat(${Math.min(ns.length,4)},minmax(170px,1fr))">${ns.map(n=>`<article class="compare-card"><div class="eyebrow">${airport(n.airport).code} / ${n.region}</div><h3 style="margin:9px 0 15px">${n.name}</h3><span class="big-number">${n.lat[0]??'—'}</span><span class="small muted"> ms</span><div class="node-meta">本站 1 样本 · 不是稳定性结论</div><div class="kv"><span>短下载</span><b>${n.down??'—'} MiB/s</b></div><div class="kv"><span>P95</span><b>样本不足</b></div><div class="kv"><span>配置版本</span><b class="mono">${n.rev}</b></div><div style="margin-top:10px">${serviceButton(n,0)}</div></article>`).join('')}</div><p class="safety">真实集成继续调用已有 qualityGroups / downloadGroup / serviceComparisonGroup。单列不满足比较条件时只解释那一列，不禁用全部结果。</p>`;footer=`<span class="small muted">不设黑箱总分，不自动选“最佳”</span><button class="btn" data-close>返回工作台</button>`}
else if(kind==='export'){titleText='导出所选 · 先核对身份';body=`<div class="sample-note">设计预览只生成选择清单，不包含真实服务器或凭据，不会导入你的代理软件。</div><div class="plain-list">${ns.map(n=>`<div class="plain-row"><div>${nodeIdentity(n)}</div><span class="mono small">scope / ${n.airport} / ${n.rev}</span></div>`).join('')}</div><div class="info-banner">正式 App 复用现有完整 scope 导出。配置已变化、歧义或漏项时明确拒绝，不取“第一个同名节点”。</div>`;footer=`<span class="small muted">下载的是设计选择清单 JSON</span><button class="btn primary" id="download-selection">下载样例清单 ${icon('download')}</button>`}
else if(kind==='criteria'){titleText='看得见，也比得明白';body=`<h3>观察值和稳定性，是两种问题</h3><div class="reason-line"><strong>单次观察</strong><p class="small muted">相同目标、方法与近似条件下，可以选出下一轮候选；仍显示样本数与时间。</p></div><div class="reason-line"><strong>P50 / 成功率</strong><p class="small muted">沿用当前质量 helper 的样本、窗口与完整度条件；不是只有“低于某数值”就算好。</p></div><div class="reason-line"><strong>P95</strong><p class="small muted">95 分位，不是最大值或“最慢一次”。样本不足显示原因，保留其它能看的指标。</p></div><div class="reason-line"><strong>最近状态与历史有效值</strong><p class="small muted">本次失败或未执行不能被旧成功遮盖。历史有效值可以回看，但不是这次的测量。</p></div>`;footer=`<span class="small muted">这里只解释现有规则，不改变筛选实现</span><button class="btn primary" data-close>明白</button>`}
else if(kind==='service'){const [id,type,idx]=String(payload).split(':');const n=node(id);if(type==='latency'){titleText=DEMO.targets[Number(idx)][1]+' · 延迟观察';body=`<div class="big-number">${n.lat[Number(idx)]??'—'} <span class="small muted">ms</span></div><p style="margin-top:16px">${n.name} · ${airport(n.airport).name}</p><p class="small muted" style="margin-top:10px">一个 HTTP 目标的单次观察，不是 ICMP Ping，也不代表另外五站可达。本窗口只有设计样例。</p>`;footer=`<button class="btn" data-close>返回六站</button>`}else{const i=Number(type),s=DEMO.services[i],o=n.services[i],[t,tone]=label(o);titleText=s.name+' · 结果与判据';body=`<div class="between">${nodeIdentity(n)}${tag(t,tone)}</div><div class="info-banner">${o==='region_blocked'?'节点已得到目标网页，但采样片目有明确地区限制；不是“节点断网”。':o==='reachable'?'仅证明指定网页端点可达；登录、播放或聊天没有被验证。':o==='matched'?'只表示这个规则定义的判据通过；不要扩大为账号与全部内容可用。':o==='untested'||o==='not_executed'?'没有本次有效测量，不填零，也不使用旧成功冒充。':'证据不足、挑战或限流分别保留，不改成绿色通过。'}</div><div class="kv"><span>判断范围</span><b>${s.kind}</b></div><div class="kv"><span>实际判据</span><b>${s.rule}</b></div><div class="kv"><span>方法版本 / 样本</span><b>设计示例 / 1 次观察</b></div><div class="kv"><span>HTTP 传输</span><b>${o==='untested'||o==='not_executed'?'未发起':o==='challenge'?'403 · 示例':o==='rate_limited'?'429 · 示例':i===5&&o==='matched'?'204 · 示例':'200 · 示例'}</b></div><div class="kv"><span>账号 / 播放 / 聊天</span><b>未验证</b></div><div class="kv"><span>结果保存</span><b>${n.state.includes('保存失败')?'保存失败，原结果保留':'已保存 · 示例'}</b></div><p class="safety">来自合成样例，不是用户真实响应。正式版本直接读取 rule/result/details，不伪造目标响应、独立出口或请求耗时。</p>`;footer=`<span class="small muted">颜色、中文结论和判据一起出现</span><button class="btn" data-close>关闭</button>`}}
else if(kind==='ip'){const n=node(payload);titleText=n.name+' · 出口与信誉';body=`<p class="sample-note">IP 使用保留文档地址 192.0.2.0/24，仅为合成示例，不是被测节点的真实出口。</p><div class="kv"><span>节点/账户</span><b>${airport(n.airport).name} · ${n.name}</b></div><div class="kv"><span>订阅声明地区</span><b>${n.region} · 不是实测</b></div><div class="kv"><span>示例观测出口</span><b class="mono">${n.exitIp??'尚未查询'}</b></div><div class="kv"><span>示例出口地区</span><b>${n.exitRegion??'未知'}</b></div><div class="kv"><span>IP信誉</span><b>未查询 · 不填风险分</b></div><div class="kv"><span>提供方/时间</span><b>设计样例，无真实查询</b></div><div class="info-banner">显示已保存的 IP/信誉与主动查询是两种动作。打开这里不查询 IPOK 或外部服务，也不消耗费用。IP 相同、接口绑定不证明实际包绕过 TUN。</div><p class="safety">正式集成呈现已有结果、来源与时间；额外 IP 查询由用户和功能开发端决定，UI 不新增请求管线或黑箱评分。</p>`;footer=`<button class="btn primary" data-close>返回节点</button>`}
else if(kind==='sources'){titleText='选择浏览来源 · 机场与账户';body=`<p class="small muted">只影响本预览的浏览范围，已勾选节点仍保留，检测计划不自动启动。</p>${DEMO.airports.map(a=>`<label class="source-option"><input type="checkbox" data-enabled="${a.id}" ${state.enabled.has(a.id)?'checked':''}><span class="source-meta"><strong>${a.name}</strong><small>${a.accounts.join(' / ')}</small></span><span class="mono small">04 NODES</span></label>`).join('')}`;footer=`<span class="small muted">保留至少一个来源</span><button class="btn primary" id="apply-sources">应用浏览范围</button>`}
else if(kind==='queue'){titleText='队列恢复 · 场景演示';body=queueBody();footer=`<span class="small muted">本地示例状态切换 · 零网络</span><button class="btn" id="queue-next">下一个场景 ${icon('arrow')}</button>`}
else if(kind==='monitor'){titleText='持续监测配置样例';body=`<p class="sample-note">现有监测能力保留。这份独立原型不执行后台采样，也不会恢复旧任务。</p><div class="form-grid"><div class="field"><label for="monitor-interval">间隔示例</label><select id="monitor-interval"><option>5 分钟</option><option>10 分钟</option></select></div><div class="field"><label>当前意图</label><div>${tag('保持停止','empty')}</div></div></div><p class="safety">正式集成：状态读取的时效、真实 started/paused/stopped、恢复失败原因均来自现有 jobs，不用前端倒计时伪造“监测中”。</p>`;footer=`<button class="btn" data-close>仅查看，不启动</button>`}
else if(kind==='restore'){titleText='恢复范围示例 · 不执行';body=`<div class="info-banner">这不是实际恢复按钮，没有连接数据库。</div><div class="plain-row"><strong>订阅与账户</strong><span>独立配置，需核对凭据范围</span></div><div class="plain-row"><strong>轮次与节点历史</strong><span>保留原配置版本关联</span></div><div class="plain-row"><strong>主题与默认值</strong><span>不能改变旧检测条件</span></div><p class="safety">正式 App 复用已有一致快照与恢复流程；不会靠复制活动 db 文件替代备份，也不借 UI 改造迁移旧库。</p>`;footer=`<button class="btn primary" data-close>关闭范围说明</button>`}
const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${titleText}</h2><button class="iconbtn" data-close aria-label="关闭弹窗">${icon('close')}</button></div><div class="modal-content">${body}</div><div class="modal-footer">${footer}</div></section>`;document.body.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});bindModal();if(kind==='plan')updateBudget();setTimeout(()=>$('.modal [data-close]')?.focus(),0)}
function queueBody(){const steps=[['正常完成','全部 3 项得到终态；执行与保存分别展示。'],['单项明确拒绝','第二项配置已变化，没有执行；第三项继续。'],['启动未知','正在查询原请求 req-demo-018。未确认前不重发同一通道。'],['保存失败','测量已结束，原结果还在；只重试保存，不再次测速。']];const s=steps[state.step];return `<p class="sample-note">展示已有后端合同的四类结果。本原型仅切换示例状态，不发请求。</p><div class="queue-flow">${steps.map((x,i)=>`<span class="${i===state.step?'active':''}">0${i+1} ${x[0]}</span>`).join('')}</div><div class="queue-step"><strong>${s[0]}</strong><p>${s[1]}</p></div><div class="plain-row"><span>节点 A · 已执行</span>${tag('已保存','good')}</div><div class="plain-row"><span>节点 B · ${state.step===1?'未执行':state.step===2?'接纳未知':'已执行'}</span>${tag(state.step===1?'配置已变化':state.step===2?'查询原请求':state.step===3?'保存失败':'已保存',state.step===0?'good':'warn')}</div><div class="plain-row"><span>节点 C · ${state.step===2?'通道暂停':'已执行'}</span>${tag(state.step===2?'尚未派发':'已保存',state.step===2?'empty':'good')}</div><p class="small muted" style="margin-top:16px">没有百分比假动画。8/8 终态不能称 8/8 业务成功。</p>`}
function updateBudget(){const count=selected().length,t=Number($('#plan-target').value),s=Number($('#plan-samples').value),d=Math.max(0,Number($('#plan-download').value)||0);$('#budget-summary').innerHTML=`<div><b>${count}</b><small>冻结节点（预览）</small></div><div><b>${count*t*s}</b><small>延迟计划目标尝试</small></div><div><b>${(count*d).toFixed(0)} <small>MiB</small></b><small>下载响应体预算</small></div>`}
function downloadSelection(){const payload={notice:'CST设计样例选择清单，不是代理配置，不包含真实服务器或密钥',created_by:'CST · 线路观测台 / 只读原型',nodes:selected().map(n=>({profile_id:n.airport+'-account-'+n.account,node_identity_key:n.id,config_revision_key:n.rev,name:n.name}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CST-设计样例选择清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已导出本预览的选择清单；没有生成或改写真实配置。')}
function refreshTable(){const slot=$('#node-table-slot');if(slot)slot.innerHTML=table();const m=$('#count-meta');if(m)m.textContent=visible().length+' 个节点 · 结果更新不自动改变选择 · 样例：同方法 / 同窗口';const d=$('.selection-dock');if(d)d.outerHTML=dock();bindDynamic()}
function bind(){ $$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.detail=null;render()}); $$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$$('button[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;render()});$$('[data-source]').forEach(b=>b.onclick=()=>{state.focus=b.dataset.source;state.account='all';state.detail=null;render()});if($('#cycle-source'))$('#cycle-source').onclick=()=>{const ids=['all',...[...state.enabled]];state.focus=ids[(ids.indexOf(state.focus)+1)%ids.length];state.account='all';render()};if($('#node-search'))$('#node-search').oninput=e=>{state.query=e.target.value;state.detail=null;refreshTable()};if($('#region-filter'))$('#region-filter').onchange=e=>{state.region=e.target.value;state.detail=null;refreshTable()};if($('#node-sort'))$('#node-sort').onchange=e=>{state.sort=e.target.value;refreshTable()};if($('#account-filter'))$('#account-filter').onchange=e=>{state.account=e.target.value;render()};$$('[data-airport]').forEach(b=>b.onclick=()=>{state.airport=b.dataset.airport;render()});$$('[data-browse-airport]').forEach(b=>b.onclick=()=>{state.enabled.add(b.dataset.browseAirport);state.focus=b.dataset.browseAirport;state.account='all';state.query='';state.region='all';setPage('home')});$$('[data-account-info]').forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.accountInfo.split(':');state.focus=id;state.account=i;state.query='';state.region='all';setPage('home')});$$('[data-round]').forEach(b=>b.onclick=()=>{state.round=Number(b.dataset.round);render()});if($('#history-filter'))$('#history-filter').onchange=e=>{state.historyFilter=e.target.value;render()};if($('#density'))$('#density').onchange=e=>{state.density=e.target.value;render()};bindDynamic()}
function bindDynamic(){ $$('[data-ip]').forEach(b=>b.onclick=()=>showModal('ip',b.dataset.ip)); $$('[data-select]').forEach(b=>b.onchange=()=>{b.checked?state.selected.add(b.dataset.select):state.selected.delete(b.dataset.select);refreshTable()});if($('#select-visible'))$('#select-visible').onchange=e=>{visible().forEach(n=>e.target.checked?state.selected.add(n.id):state.selected.delete(n.id));refreshTable()};if($('#clear-selection'))$('#clear-selection').onclick=()=>{state.selected.clear();refreshTable()};if($('#clear-filters'))$('#clear-filters').onclick=()=>{state.query='';state.region='all';state.focus='all';state.account='all';render()};$$('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=state.detail===b.dataset.detail&&state.pinnedRound===null?null:b.dataset.detail;state.pinnedRound=null;hideTip();if(state.page==='home')refreshTable();else{state.page='home';state.query='';state.region='all';state.focus='all';render()}});$$('[data-detail-round]').forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.detailRound.split(':');state.detail=id;state.pinnedRound=Number(i);hideTip();refreshTable()});$$('[data-modal]').forEach(b=>b.onclick=()=>showModal(b.dataset.modal));$$('[data-service]').forEach(b=>b.onclick=()=>{hideTip();showModal('service',b.dataset.service)});bindTips()}
function bindTips(){ $$('[data-tip]').forEach(b=>{b.onpointerenter=e=>{hideTip();const t=document.createElement('div');t.className='tip';t.setAttribute('role','tooltip');t.innerHTML=`<strong>本轮证据预览</strong>${esc(b.dataset.tip)}`;document.body.appendChild(t);const box=b.getBoundingClientRect();t.style.left=Math.min(window.innerWidth-t.offsetWidth-16,Math.max(16,box.left))+'px';t.style.top=Math.min(window.innerHeight-t.offsetHeight-16,box.bottom+8)+'px'};b.onfocus=b.onpointerenter;b.onpointerleave=hideTip;b.onblur=hideTip})}
function hideTip(){$('.tip')?.remove()}
function bindModal(){ $$('.modal [data-ip]').forEach(b=>b.onclick=()=>drawModal('ip',b.dataset.ip));$$('.modal [data-close]').forEach(b=>b.onclick=closeModal);$$('.modal [data-service]').forEach(b=>b.onclick=()=>drawModal('service',b.dataset.service));if($('#download-selection'))$('#download-selection').onclick=downloadSelection;if($('#save-demo-plan'))$('#save-demo-plan').onclick=()=>{closeModal();toast('预览参数已确认。未启动测试，也未改动实际 App。')};$$('.modal input,.modal select').forEach(b=>{if(state.modal==='plan')b.oninput=updateBudget});if($('#apply-sources'))$('#apply-sources').onclick=()=>{const enabled=$$('.modal [data-enabled]:checked').map(b=>b.dataset.enabled);if(!enabled.length){toast('至少保留一个浏览来源。');return}state.enabled=new Set(enabled);if(state.focus!=='all'&&!state.enabled.has(state.focus))state.focus='all';state.account='all';closeModal();render()};if($('#queue-next'))$('#queue-next').onclick=()=>{state.step=(state.step+1)%4;drawModal('queue')};}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){e.preventDefault();closeModal()}else if(state.detail){state.detail=null;refreshTable()}hideTip()}if(e.key==='Tab'&&state.modal){const focusable=$$('.modal button:not([disabled]),.modal input,.modal select,.modal summary,.modal a[href]');if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='system')render()});
